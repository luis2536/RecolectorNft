name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite compilar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generar Gradle Wrapper
      run: gradle wrapper

    - name: Dar permisos a Gradle
      run: chmod +x ./gradlew

    - name: Generar debug.keystore para CI
      run: |
        if [ ! -f ./debug.keystore ]; then
          keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        fi

    - name: Compilar APK (Debug)
      run: ./gradlew assembleDebug

    - name: Subir APK para descargar
      uses: actions/upload-artifact@v4
      with:
        name: Nexus-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
